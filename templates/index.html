<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대학 행정 문서 초안 생성기</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=4">
</head>
<body>
  <div class="top-accent-bar"></div>
  <div class="container">
    <header class="page-header">
      <div class="brand-header">
        <img
          src="{{ url_for('static', filename='images/suwon-logo.png') }}"
          alt="수원대학교 로고"
          class="brand-logo"
        >
        <div>
          <h1>대학 행정 문서 초안 생성기</h1>
          <p class="subtitle">문서 종류와 핵심 사실을 입력하면 AI가 업무 문서 초안을 작성해 줍니다.</p>
        </div>
      </div>
    </header>

    <main class="main-grid">
      <!-- 입력 영역 -->
      <section class="card">
        <div class="card-header">
          <h2>1. 문서 정보 입력</h2>
          <div class="result-actions">
            <button type="button" id="load-facts-btn" class="btn-secondary">불러오기</button>
            <button type="button" id="fill-example-btn" class="btn-secondary">예시 채우기</button>
          </div>
        </div>
        <form id="draft-form" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label for="doc_type">문서 종류 <span class="required">*</span></label>
              <select id="doc_type" name="doc_type">
                <option value="">-- 선택해 주세요 --</option>
                <option value="보도자료">보도자료</option>
                <option value="안내문">안내문</option>
                <option value="기안문">기안문</option>
                <option value="결과 보고">결과 보고</option>
                <option value="업무 메일">업무 메일</option>
              </select>
            </div>

            <div class="form-group">
              <label for="tone">어조</label>
              <select id="tone" name="tone">
                <option value="공식적">공식적</option>
                <option value="친근한">친근한</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="title">제목 <span class="required">*</span></label>
            <input
              type="text"
              id="title"
              name="title"
              placeholder="예: 2026학년도 1학기 교내 AI 특강 안내"
            >
          </div>

          <div class="form-group">
            <label for="recipient">받는 사람</label>
            <input
              type="text"
              id="recipient"
              name="recipient"
              placeholder="예: 전체 재학생 및 교직원"
            >
          </div>

          <div class="facts-section">
            <h3>핵심 사실 카드</h3>
            <p class="helper-text">비워 둔 항목이 있어도 작성할 수 있습니다. 입력 내용은 브라우저에 자동 저장됩니다.</p>
            <div class="facts-grid">
              <div class="form-group">
                <label for="datetime">일시</label>
                <input type="text" id="datetime" name="datetime" placeholder="예: 2026. 5. 14.(목) 14:00~16:00">
              </div>

              <div class="form-group">
                <label for="location">장소</label>
                <input type="text" id="location" name="location" placeholder="예: 본관 3층 대회의실">
              </div>

              <div class="form-group">
                <label for="target">대상</label>
                <input type="text" id="target" name="target" placeholder="예: 학부생 선착순 50명">
              </div>

              <div class="form-group">
                <label for="apply_method">신청 방법</label>
                <input type="text" id="apply_method" name="apply_method" placeholder="예: 학생포털 비교과 신청 페이지">
              </div>

              <div class="form-group full-width">
                <label for="contact">문의처</label>
                <input type="text" id="contact" name="contact" placeholder="예: 교무처 교육혁신팀 (02-1234-5678)">
              </div>
            </div>
          </div>

          <div class="form-group">
            <span class="label-title">Prompt 방식 선택</span>
            <div class="radio-group">
              <label class="radio-card">
                <input type="radio" name="prompt_type" value="A" checked>
                <span>
                  <strong>Prompt A</strong>
                  <small>입력 정보만으로 자연스럽게 문서 작성</small>
                </span>
              </label>
              <label class="radio-card">
                <input type="radio" name="prompt_type" value="B">
                <span>
                  <strong>Prompt B</strong>
                  <small>6하원칙·공식 문체·문의처 점검 + 없는 내용은 [확인 필요] 표시</small>
                </span>
              </label>
            </div>
          </div>

          <div id="error-message" class="alert-error" role="alert" hidden></div>

          <div class="form-actions">
            <button type="submit" id="generate-btn" class="btn-primary">초안 생성</button>
          </div>
          <p id="facts-status" class="copy-status" aria-live="polite"></p>
        </form>
      </section>

      <!-- 결과 영역 -->
      <section class="card result-card">
        <div class="result-header">
          <h2>2. 생성된 초안</h2>
          <div class="result-actions">
            <button type="button" id="copy-btn" class="btn-secondary" disabled>복사</button>
            <button type="button" id="download-btn" class="btn-secondary" disabled>.md 다운로드</button>
          </div>
        </div>

        <div id="loading-indicator" class="loading-box" hidden>
          생성 중...
        </div>

        <div class="view-tabs" role="tablist">
          <button type="button" id="preview-tab" class="tab-btn active" role="tab" aria-selected="true">미리보기</button>
          <button type="button" id="edit-tab" class="tab-btn" role="tab" aria-selected="false">직접 수정</button>
        </div>

        <div id="draft-preview" class="draft-preview">
          <p class="placeholder-text">여기에 생성된 문서 초안이 표시됩니다.</p>
        </div>
        <textarea
          id="draft-editor"
          class="draft-editor"
          hidden
          placeholder="생성된 문서 초안을 여기에서 직접 수정할 수 있습니다."
        ></textarea>
        <p id="copy-status" class="copy-status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}?v=3" defer></script>
</body>
</html>
